# Clinical Flags Configuration
# Priority order: red > black > yellow > blue
# Thresholds: red>=1, black>=1, yellow>=2, blue>=2

flags:
  red:
    - id: "R01"
      name: " Болезненность при пальпации/перкуссии"
      keywords: ["болезненность при пальпации", "болезненность при перкуссии", "боль над остистыми отростками"]
      priority: 1
    - id: "R02"
      name: "Боль в грудной клетке со спины"
      keywords: ["боль в грудной клетке", "боль в груди + боль в спине"]
      priority: 1
    - id: "R03"
      name: "Внутривенное употребление наркотиков"
      keywords: ["в/в наркотики", "внутривенное употребление наркотиков", "наркомания", "внутривенные наркотики"]
      priority: 1
    - id: "R04"
      name: "Возраст дебюта боли <20 или >55 лет"
      keywords: ["дебют боли в возрасте", "начало боли в возрасте"]
      priority: 1
      age_trigger: true
    - id: "R05"
      name: "Выраженная деформация позвоночника"
      keywords: ["сколиоз", "кифосколиоз", "выраженная деформация позвоночника", "деформация позвоночника"]
      priority: 1
    - id: "R06"
      name: "Длительный приём кортикостероидов"
      keywords: ["кортикостероиды", "преднизолон", "дексаметазон", "гормональная терапия", "метилпреднизолон"]
      priority: 1
    - id: "R07"
      name: "Иммунодефицит"
      keywords: ["ВИЧ", "иммуносупрессоры", "иммунодефицит", "СПИД", "immunosuppression"]
      priority: 1
    - id: "R08"
      name: "Локализация боли в грудном отделе"
      keywords: ["боль в грудном отделе", "торакалгия", "Th-отдел", "грудной отдел позвоночника"]
      priority: 1
    - id: "R09"
      name: "Онкология в анамнезе"
      keywords: ["онкология", "злокачественное заболевание", "рак", "опухоль", "метастазы", "карцинома", "neoplasm"]
      priority: 1
    - id: "R10"
      name: "Нарастающий характер боли"
      keywords: ["прогрессирующая боль", "нарастание боли", "усиление боли", "прогрессирование боли"]
      priority: 1
    - id: "R11"
      name: "Потеря массы тела/слабость/лихорадка"
      keywords: ["потеря массы тела", "похудение", "лихорадка", "недомогание", "слабость", "кахексия"]
      priority: 1
    - id: "R12"
      name: "Остеопороз/остеопения"
      keywords: ["остеопороз", "остеопения", "денситометрия", "компрессионный перелом", "снижение костной массы"]
      priority: 1
    - id: "R13"
      name: "Отсутствие облегчения лёжа"
      keywords: ["боль в покое", "боль в положении лёжа", "нет облегчения лёжа", "боль не проходит лёжа"]
      priority: 1
    - id: "R14"
      name: "Травма спины"
      keywords: ["травма спины", "падение", "ушиб позвоночника", "травма позвоночника"]
      priority: 1
    - id: "R15"
      name: "Инфекционно-воспалительные заболевания"
      keywords: ["инфекция", "воспаление", "лихорадка", "субфебрилитет", "спондилит", "дисцит"]
      priority: 1
    - id: "R16"
      name: "Симптом кашлевого толчка"
      keywords: ["кашлевой толчок", "боль при кашле", "боль при чихании", "боль при натуживании"]
      priority: 1
    - id: "R17"
      name: "Температура >37°C"
      keywords: ["температура", "субфебрилитет", "гипертермия", "37°C", "лихорадка", "fever"]
      priority: 1
      temperature_trigger: true

  yellow:
    - id: "Y01"
      name: "Катастрофизация боли"
      keywords: ["это никогда не пройдёт", "я разрушен", "безнадёжность", "катастрофизация", "catastrophizing"]
      priority: 3
    - id: "Y02"
      name: "Депрессия"
      keywords: ["депрессия", "сниженный фон", "тревожно-депрессивные проявления", "апатия", "депрессивный"]
      priority: 3
    - id: "Y03"
      name: "Дистресс"
      keywords: ["дистресс", "стресс", "эмоциональное напряжение", "эмоциональная лабильность"]
      priority: 3
    - id: "Y04"
      name: "Избегание активности"
      keywords: ["избегание", "ограничение активности", "боюсь сделать хуже", "избегает активности"]
      priority: 3
    - id: "Y05"
      name: "Кинезиофобия"
      keywords: ["страх движения", "кинезиофобия", "страх обострения", "kinesiophobia"]
      priority: 3
    - id: "Y06"
      name: "Пассивные копинг-стратегии"
      keywords: ["пусть лечат врачи", "постельный режим", "пассивное лечение", "только уколы"]
      priority: 3
    - id: "Y07"
      name: "Плохая самооценка здоровья"
      keywords: ["я в плохом здоровье", "плохая самооценка", "ощущение плохого здоровья"]
      priority: 3
    - id: "Y08"
      name: "Ожидание пассивного лечения"
      keywords: ["ожидание пассивного лечения", "постельный режим", "нежелание двигаться"]
      priority: 3
    - id: "Y09"
      name: "Хроническая боль"
      keywords: ["хроническая боль", "длительная боль", "более 3 месяцев", "хронический болевой синдром"]
      priority: 3
    - id: "Y10"
      name: "Тревога"
      keywords: ["тревога", "тревожность", "тревожно-депрессивные проявления", "anxiety"]
      priority: 3

  blue:
    - id: "B01"
      name: "Высокие рабочие требования"
      keywords: ["дефицит времени", "малая частота перерывов", "перегрузка", "высокие требования", "work overload"]
      priority: 4
    - id: "B02"
      name: "Неблагоприятный командный климат"
      keywords: ["неблагоприятный климат", "конфликты в коллективе", "командный климат", "conflict at work"]
      priority: 4
    - id: "B03"
      name: "Низкая социальная поддержка"
      keywords: ["низкая поддержка", "неадекватная поддержка", "нет поддержки от руководства", "lack of support"]
      priority: 4
    - id: "B04"
      name: "Низкая оценка успехов"
      keywords: ["низкая оценка успехов", "нет признания", "не ценят работу", "no recognition"]
      priority: 4
    - id: "B05"
      name: "Низкая удовлетворённость работой"
      keywords: ["неудовлетворённость работой", "не доволен работой", "job dissatisfaction"]
      priority: 4
    - id: "B06"
      name: "Низкий рабочий контроль"
      keywords: ["нет влияния на темп работы", "нет влияния на способ выполнения", "низкий контроль", "low control"]
      priority: 4
    - id: "B07"
      name: "Связывание боли с работой"
      keywords: ["боль из-за работы", "работа причина боли", "связывание боли с работой", "work-related pain"]
      priority: 4
    - id: "B08"
      name: "Скептический настрой к возвращению"
      keywords: ["сомневаюсь что смогу работать", "не вернусь к работе", "скептический настрой", "не смогу справляться"]
      priority: 4

  black:
    - id: "BK01"
      name: "Неправильный подход к лечению"
      keywords: ["ятрогенный", "неправильное лечение", "переобследование", "неадекватное лечение", "inappropriate treatment"]
      priority: 2
    - id: "BK02"
      name: "Безработица"
      keywords: ["безработный", "не работает", "увольнение", "unemployed", "потеря работы"]
      priority: 2
    - id: "BK03"
      name: "Компенсаторные выплаты"
      keywords: ["компенсации", "выплаты по инвалидности", "компенсаторные выплаты", "disability compensation"]
      priority: 2
    - id: "BK04"
      name: "Требования инвалидности"
      keywords: ["оформление инвалидности", "МРЭ", "постоянные требования инвалидности", "MSE"]
      priority: 2

# Negation patterns (exclude flags if found within ±5 words window)
negation_patterns:
  - "нет"
  - "исключено"
  - "отрицает"
  - "в норме"
  - "отсутствует"
  - "не выявлено"
  - "без"
  - "не было"
  - "никогда не"
  - "исключают"

# Exclusion patterns (ignore LP mentions)
exclusion_patterns:
  - "профилактически"
  - "однократно"
  - "исключено"
  - "без потери массы"
  - "случайно"

# Context window size (words before and after keyword)
context_window: 5

# Thresholds for flag activation
thresholds:
  red: 1
  black: 1
  yellow: 2
  blue: 2

# Confidence rules
confidence_rules:
  high_keywords:
    - "диагноз"
    - "МРТ"
    - "КТ"
    - "рентген"
    - "денситометрия"
    - "анализ"
    - "подтверждено"
    - "выявлено"
    - "обнаружено"
    - "\\d+\\.\\d+"  # numeric values (temperature, etc.)
  medium_keywords:
    - "жалобы"
    - "анамнез"
    - "со слов пациента"
    - "отмечает"
    - "сообщает"
  low_keywords:
    - "возможно"
    - "вероятно"
    - "предположительно"
    - "может быть"
