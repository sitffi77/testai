# config/training_config.yaml
# Параметры процесса дообучения модели

training:
  # Минимальное количество размеченных примеров для старта обучения
  min_samples: 20
  
  # Доля данных для валидации (0.2 = 20%)
  validation_split: 0.2
  
  # Стратегия обновления модели
  # 'incremental' - попытка дообучить веса (если поддерживается booster)
  # 'retrain' - полное переобучение на всех доступных данных (рекомендуется для XGBoost)
  strategy: retrain
  
  # Гиперпараметры для дообучения (могут отличаться от базовой модели)
  params:
    max_depth: 6
    learning_rate: 0.05  # Меньше, чтобы не "забыть" старые знания резко
    n_estimators: 100    # Количество новых деревьев или общее при ретрэйне
    subsample: 0.8
    colsample_bytree: 0.8
    objective: multi:softprob
    eval_metric: mlogloss
    
  # Порог качества для сохранения модели
  min_accuracy_threshold: 0.75
  
  # Путь для сохранения бэкапов старых моделей
  backup_dir: "models/backups"
