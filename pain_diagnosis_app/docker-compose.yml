version: '3.8'

services:
  # Pain Diagnosis Application (GUI mode with X11 forwarding)
  app-gui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pain-diagnosis-app
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pain_diagnosis
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - QT_QPA_PLATFORM=xcb
    volumes:
      # Share X11 socket for GUI display (Linux)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Persist application data
      - app-logs:/app/logs
      - app-models:/app/models/saved
      # Optional: mount local config
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pain-network
    # Uncomment below for GPU support (if using CUDA-enabled ML models)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - gui

  # Pain Diagnosis Application (Headless/Server mode)
  app-headless:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pain-diagnosis-headless
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=pain_diagnosis
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - QT_QPA_PLATFORM=offscreen
    volumes:
      - app-logs:/app/logs
      - app-models:/app/models/saved
      - ./config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pain-network
    stdin_open: true
    tty: true
    profiles:
      - headless

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: pain-diagnosis-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_DATABASE: pain_diagnosis
      MYSQL_USER: pain_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - pain-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-changeme}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # phpMyAdmin (Optional database management UI)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pain-diagnosis-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-changeme}
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - pain-network
    profiles:
      - dev

networks:
  pain-network:
    driver: bridge

volumes:
  db-data:
    driver: local
  app-logs:
    driver: local
  app-models:
    driver: local
